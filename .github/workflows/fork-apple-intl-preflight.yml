name: Fork Apple Intl preflight

on:
  workflow_dispatch:
    inputs:
      patch_sha:
        description: Full contribution commit SHA
        required: true
        type: string
      base_sha:
        description: Full upstream static_h commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-intl:
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            cmake_flags: ""
            lit_flags: ""
            test_runner_flags: ""
          - mode: jit
            cmake_flags: "-DHERMESVM_ALLOW_JIT=2"
            lit_flags: "-Xjit=force"
            test_runner_flags: "--vm-args=-Xjit=force"
    name: macOS Intl ${{ matrix.mode }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6
      - uses: actions/checkout@v4.1.0
        with:
          ref: ${{ inputs.patch_sha }}
          path: hermes
          fetch-depth: 0
          persist-credentials: false
      - name: Verify contribution and test upstream merge
        env:
          PATCH_SHA: ${{ inputs.patch_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          [[ "$PATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C hermes rev-parse HEAD)" = "$PATCH_SHA"
          git -C hermes fetch https://github.com/facebook/hermes.git "$BASE_SHA"
          test "$(git -C hermes rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git -C hermes -c user.name=Preflight -c user.email=preflight@example.invalid merge --no-commit --no-ff "$BASE_SHA"
          git -C hermes diff --check
          git -C hermes write-tree
          git -C hermes log -1 --format='%H %s'
      - name: Install dependencies and pinned Test262
        run: |
          brew update
          (brew list ninja cmake || brew install ninja cmake)
          git clone https://github.com/tc39/test262
          git -C test262 checkout c9aa6126e8f6fe2c6f668c65bfba771ffc8a6096
      - name: Build and run Hermes and Test262 tests
        env:
          LIT_HERMES_EXTRA_FLAGS: ${{ matrix.lit_flags }}
        run: |
          cmake -S hermes -B build -GNinja -DHERMES_ENABLE_INTL=ON -DHERMES_ENABLE_ADDRESS_SANITIZER=ON -DCMAKE_CXX_FLAGS=-O1 -DCMAKE_C_FLAGS=-O1 -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_flags }}
          cmake --build ./build
          cmake --build ./build --target check-hermes
          python3 hermes/utils/test_runner.py --test-intl test262/test -b build/bin ${{ matrix.test_runner_flags }}
